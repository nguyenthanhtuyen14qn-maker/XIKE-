name: Build XI KE Agent APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xike-agent-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: XiKeAgent-apk
          path: xike-agent-app/app/build/outputs/apk/release/*.apk
